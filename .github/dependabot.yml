version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Almaty
    open-pull-requests-limit: 5
    target-branch: develop
    labels:
      - dependencies
    commit-message:
      prefix: chore
      include: scope
    groups:
      frontend-minor:
        update-types:
          - minor
          - patch

  - package-ecosystem: cargo
    directory: /apps/desktop/src-tauri
    schedule:
      interval: weekly
      day: monday
      time: "06:20"
      timezone: Asia/Almaty
    open-pull-requests-limit: 5
    target-branch: develop
    labels:
      - dependencies
      - security
    commit-message:
      prefix: chore
      include: scope
    groups:
      rust-minor:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      day: monday
      time: "06:40"
      timezone: Asia/Almaty
    open-pull-requests-limit: 3
    target-branch: develop
    labels:
      - dependencies
      - ci
    commit-message:
      prefix: chore
      include: scope