name: Одноразовое уточнение file policy v0.3.3

on:
  push:
    branches: [fix/0.3.3-bugfix]
    paths:
      - '.github/workflows/v033-file-policy.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/0.3.3-bugfix
          fetch-depth: 0
      - name: Уточнить share mode и UNC policy
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/desktop/src-tauri/src/analysis/file.rs')
          text = path.read_text(encoding='utf-8')
          old = '''    let file_path = PathBuf::from(&path);\n\n    reject_special_path(&file_path)?;\n    let mut file = OpenOptions::new()\n        .read(true)\n        .open(&file_path)\n        .map_err(|error| AnalysisFailure::io(format!("Не удалось открыть файл: {error}")))?;'''
          new = '''    let file_path = PathBuf::from(&path);\n\n    if is_unc_path(&path) {\n        return Err(AnalysisFailure::new(\n            AnalysisFailureCode::UnsupportedObject,\n            "UNC и сетевые пути не анализируются в v0.3.3: удалённая файловая система не гарантирует локальную семантику identity и share mode.",\n        ));\n    }\n    reject_special_path(&file_path)?;\n    let mut file = open_file_for_analysis(&file_path)?;'''
          if old not in text:
              raise SystemExit('open fragment missing')
          text = text.replace(old, new, 1)

          marker = 'fn reject_special_path(path: &Path) -> Result<(), AnalysisFailure> {'
          helper = '''#[cfg(windows)]\nfn open_file_for_analysis(path: &Path) -> Result<File, AnalysisFailure> {\n    use std::os::windows::fs::OpenOptionsExt;\n    const FILE_SHARE_READ: u32 = 0x00000001;\n    OpenOptions::new()\n        .read(true)\n        .share_mode(FILE_SHARE_READ)\n        .open(path)\n        .map_err(|error| AnalysisFailure::io(format!("Не удалось открыть файл для стабильного чтения: {error}")))\n}\n\n#[cfg(not(windows))]\nfn open_file_for_analysis(path: &Path) -> Result<File, AnalysisFailure> {\n    OpenOptions::new()\n        .read(true)\n        .open(path)\n        .map_err(|error| AnalysisFailure::io(format!("Не удалось открыть файл для стабильного чтения: {error}")))\n}\n\n#[cfg(windows)]\nfn is_unc_path(path: &str) -> bool {\n    path.starts_with(r"\\\\") || path.starts_with("//")\n}\n\n#[cfg(not(windows))]\nfn is_unc_path(_path: &str) -> bool {\n    false\n}\n\n'''
          if marker not in text:
              raise SystemExit('helper marker missing')
          text = text.replace(marker, helper + marker, 1)
          text = text.replace(
              '"reparsePointAllowed": false',
              '"reparsePointAllowed": false,\n            "windowsShareMode": "FILE_SHARE_READ only; write/delete sharing denied",\n            "networkPathPolicy": "UNC rejected"',
              1,
          )
          path.write_text(text, encoding='utf-8')
          PY
          cd apps/desktop/src-tauri
          cargo fmt --all
      - name: Удалить workflow и зафиксировать изменения
        run: |
          rm .github/workflows/v033-file-policy.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/desktop/src-tauri/src/analysis/file.rs
          git add -u .github/workflows/v033-file-policy.yml
          git commit -m 'fix(file): зафиксировать Windows share mode и UNC policy'
          git push origin HEAD:fix/0.3.3-bugfix
