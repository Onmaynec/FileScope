name: Одноразовая диагностика Rust tests v0.3.3

on:
  push:
    branches: [fix/0.3.3-bugfix]
    paths:
      - '.github/workflows/v033-cargo-test-diagnostic.yml'

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/0.3.3-bugfix
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Сохранить полный вывод cargo test
        shell: pwsh
        working-directory: apps/desktop/src-tauri
        run: |
          cargo test --locked -- --nocapture *>&1 | Tee-Object -FilePath ../../../v033-rust-test-diagnostic.log
          exit 0
      - name: Удалить workflow и зафиксировать диагностический лог
        shell: bash
        run: |
          rm .github/workflows/v033-cargo-test-diagnostic.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add v033-rust-test-diagnostic.log
          git add -u .github/workflows/v033-cargo-test-diagnostic.yml
          git commit -m 'chore(debug): сохранить вывод Rust regression tests v0.3.3'
          git push origin HEAD:fix/0.3.3-bugfix
