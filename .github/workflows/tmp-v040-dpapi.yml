name: Temporary v0.4.0 DPAPI integration

on:
  push:
    branches:
      - tmp/v040-lock-refresh

permissions:
  contents: write

jobs:
  integrate-dpapi:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-2025
    steps:
      - name: Получить временную ветку
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: tmp/v040-lock-refresh
          fetch-depth: 0

      - name: Установить Rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: stable
          components: rustfmt

      - name: Интегрировать DPAPI в history storage
        shell: python
        run: |
          from pathlib import Path

          path = Path('apps/desktop/src-tauri/src/history_storage.rs')
          text = path.read_text(encoding='utf-8')

          old_import = 'use crate::analysis::{AnalysisReport, REPORT_SCHEMA_VERSION};\n'
          new_import = '''use crate::{
              analysis::{AnalysisReport, REPORT_SCHEMA_VERSION},
              history_protection::{
                  is_dpapi_payload, protect_payload, unprotect_payload, PayloadProtection,
              },
          };
'''
          if text.count(old_import) != 1:
              raise SystemExit('history import marker mismatch')
          text = text.replace(old_import, new_import)

          old_constants = '''pub const MAXIMUM_HISTORY_PAYLOAD_BYTES: usize = 8 * 1024 * 1024;
          const HISTORY_DIRECTORY: &str = "history";
          const GENERATION_PREFIX: &str = "reports-v2-";
          const GENERATION_SUFFIX: &str = ".json";
          const TEMP_SUFFIX: &str = ".tmp";
'''
          new_constants = '''pub const MAXIMUM_HISTORY_PAYLOAD_BYTES: usize = 8 * 1024 * 1024;
          const MAXIMUM_HISTORY_FILE_BYTES: usize = MAXIMUM_HISTORY_PAYLOAD_BYTES + 64 * 1024;
          const HISTORY_DIRECTORY: &str = "history";
          const GENERATION_PREFIX: &str = "reports-v2-";
          const GENERATION_SUFFIX: &str = ".bin";
          const LEGACY_GENERATION_SUFFIX: &str = ".json";
          const TEMP_SUFFIX: &str = ".tmp";
'''
          if text.count(old_constants) != 1:
              raise SystemExit('history constants marker mismatch')
          text = text.replace(old_constants, new_constants)

          status_marker = '''#[derive(Debug, Serialize)]
          #[serde(rename_all = "camelCase")]
          pub struct HistoryStorageSnapshot {
'''
          protection_defs = '''#[derive(Debug, Clone, Copy, Serialize, PartialEq, Eq)]
          #[serde(rename_all = "camelCase")]
          pub enum HistoryProtectionStatus {
              DpapiCurrentUser,
              Plaintext,
              Mixed,
              Empty,
              Unavailable,
              NotSupported,
          }

          #[derive(Debug, Serialize)]
          #[serde(rename_all = "camelCase")]
          pub struct HistoryProtectionSnapshot {
              pub status: HistoryProtectionStatus,
              pub dpapi_generations: usize,
              pub plaintext_generations: usize,
              pub message: Option<String>,
          }

'''
          if text.count(status_marker) != 1:
              raise SystemExit('snapshot marker mismatch')
          text = text.replace(status_marker, protection_defs + status_marker)

          raw_marker = '''        if raw.len() > MAXIMUM_HISTORY_PAYLOAD_BYTES {
              return HistoryStorageSnapshot {
                  reports: envelope.reports,
                  status: HistoryStorageStatus::TooLarge,
                  persisted: false,
                  size_bytes: raw.len() as u64,
                  generation: None,
                  message: Some(format!(
                      "История превышает безопасный лимит {} байт и не была записана.",
                      MAXIMUM_HISTORY_PAYLOAD_BYTES
                  )),
              };
          }

          if let Err(error) = fs::create_dir_all(&self.directory) {
'''
          protected_marker = '''        if raw.len() > MAXIMUM_HISTORY_PAYLOAD_BYTES {
              return HistoryStorageSnapshot {
                  reports: envelope.reports,
                  status: HistoryStorageStatus::TooLarge,
                  persisted: false,
                  size_bytes: raw.len() as u64,
                  generation: None,
                  message: Some(format!(
                      "История превышает безопасный лимит {} байт и не была записана.",
                      MAXIMUM_HISTORY_PAYLOAD_BYTES
                  )),
              };
          }
          let (stored, protection) = match protect_payload(&raw) {
              Ok(value) => value,
              Err(error) => {
                  return unavailable(format!(
                      "Не удалось защитить history payload системным механизмом Windows: {error}"
                  ))
              }
          };
          if stored.len() > MAXIMUM_HISTORY_FILE_BYTES {
              return unavailable("Защищённый history payload превышает допустимый размер файла.".to_string());
          }

          if let Err(error) = fs::create_dir_all(&self.directory) {
'''
          if text.count(raw_marker) != 1:
              raise SystemExit('publish raw marker mismatch')
          text = text.replace(raw_marker, protected_marker)

          if text.count('file.write_all(&raw)') != 1:
              raise SystemExit('write raw marker mismatch')
          text = text.replace('file.write_all(&raw)', 'file.write_all(&stored)')

          cleanup_marker = '''        self.cleanup_old_generations();
              let status = if envelope.reports.is_empty() {
'''
          cleanup_replacement = '''        if protection == PayloadProtection::DpapiCurrentUser {
              self.cleanup_plaintext_generations();
          }
          self.cleanup_old_generations();
          let status = if envelope.reports.is_empty() {
'''
          if text.count(cleanup_marker) != 1:
              raise SystemExit('cleanup publish marker mismatch')
          text = text.replace(cleanup_marker, cleanup_replacement)

          if text.count('size_bytes: raw.len() as u64,\n            generation: Some(generation),') != 1:
              raise SystemExit('publish size marker mismatch')
          text = text.replace(
              'size_bytes: raw.len() as u64,\n            generation: Some(generation),',
              'size_bytes: stored.len() as u64,\n            generation: Some(generation),'
          )

          size_marker = '''        if size as usize > MAXIMUM_HISTORY_PAYLOAD_BYTES {
'''
          if text.count(size_marker) != 1:
              raise SystemExit('read size marker mismatch')
          text = text.replace(size_marker, '''        if size as usize > MAXIMUM_HISTORY_FILE_BYTES {
''')

          read_marker = '''        let raw = match fs::read(path) {
              Ok(raw) => raw,
              Err(error) => {
                  return GenerationRead::Corrupted(format!(
                      "Не удалось прочитать generation {}: {error}",
                      path.display()
                  ))
              }
          };
          let value: Value = match serde_json::from_slice(&raw) {
'''
          read_replacement = '''        let stored = match fs::read(path) {
              Ok(raw) => raw,
              Err(error) => {
                  return GenerationRead::Corrupted(format!(
                      "Не удалось прочитать generation {}: {error}",
                      path.display()
                  ))
              }
          };
          let (raw, _) = match unprotect_payload(&stored) {
              Ok(value) => value,
              Err(error) => {
                  return GenerationRead::Corrupted(format!(
                      "History generation не прошла DPAPI integrity/decryption: {error}"
                  ))
              }
          };
          if raw.len() > MAXIMUM_HISTORY_PAYLOAD_BYTES {
              return GenerationRead::Blocked(HistoryStorageSnapshot {
                  reports: Vec::new(),
                  status: HistoryStorageStatus::TooLarge,
                  persisted: false,
                  size_bytes: size,
                  generation: file_name(path),
                  message: Some("Расшифрованный history payload превышает безопасный лимит.".to_string()),
              });
          }
          let value: Value = match serde_json::from_slice(&raw) {
'''
          if text.count(read_marker) != 1:
              raise SystemExit('read generation marker mismatch')
          text = text.replace(read_marker, read_replacement)

          cleanup_method_marker = '''    fn cleanup_old_generations(&self) {
'''
          new_methods = '''    fn protection_status(&self) -> HistoryProtectionSnapshot {
              let generations = match self.generations() {
                  Ok(value) => value,
                  Err(message) => {
                      return HistoryProtectionSnapshot {
                          status: HistoryProtectionStatus::Unavailable,
                          dpapi_generations: 0,
                          plaintext_generations: 0,
                          message: Some(message),
                      }
                  }
              };
              if generations.is_empty() {
                  return HistoryProtectionSnapshot {
                      status: HistoryProtectionStatus::Empty,
                      dpapi_generations: 0,
                      plaintext_generations: 0,
                      message: None,
                  };
              }
              let mut dpapi_generations = 0;
              let mut plaintext_generations = 0;
              for path in generations {
                  let raw = match fs::read(&path) {
                      Ok(value) => value,
                      Err(error) => {
                          return HistoryProtectionSnapshot {
                              status: HistoryProtectionStatus::Unavailable,
                              dpapi_generations,
                              plaintext_generations,
                              message: Some(format!(
                                  "Не удалось определить защиту generation {}: {error}",
                                  path.display()
                              )),
                          }
                      }
                  };
                  if is_dpapi_payload(&raw) {
                      dpapi_generations += 1;
                  } else {
                      plaintext_generations += 1;
                  }
              }
              let status = match (dpapi_generations, plaintext_generations) {
                  (0, 0) => HistoryProtectionStatus::Empty,
                  (0, _) if cfg!(windows) => HistoryProtectionStatus::Plaintext,
                  (0, _) => HistoryProtectionStatus::NotSupported,
                  (_, 0) => HistoryProtectionStatus::DpapiCurrentUser,
                  _ => HistoryProtectionStatus::Mixed,
              };
              let message = match status {
                  HistoryProtectionStatus::DpapiCurrentUser => Some(
                      "History generations защищены Windows DPAPI в scope текущего пользователя.".to_string(),
                  ),
                  HistoryProtectionStatus::Plaintext => Some(
                      "Обнаружена legacy plaintext history; при следующей безопасной перезаписи она будет мигрирована в DPAPI.".to_string(),
                  ),
                  HistoryProtectionStatus::Mixed => Some(
                      "Текущая history защищена DPAPI, но рядом осталась legacy plaintext generation; требуется повторная cleanup/rewrite.".to_string(),
                  ),
                  HistoryProtectionStatus::NotSupported => Some(
                      "DPAPI доступен только на Windows; этот runtime не обеспечивает системную защиту history payload.".to_string(),
                  ),
                  HistoryProtectionStatus::Unavailable => Some(
                      "Не удалось определить фактическое состояние защиты history storage.".to_string(),
                  ),
                  HistoryProtectionStatus::Empty => None,
              };
              HistoryProtectionSnapshot {
                  status,
                  dpapi_generations,
                  plaintext_generations,
                  message,
              }
          }

          fn cleanup_plaintext_generations(&self) {
              let Ok(generations) = self.generations() else {
                  return;
              };
              for path in generations {
                  let Ok(raw) = fs::read(&path) else {
                      continue;
                  };
                  if !is_dpapi_payload(&raw) {
                      let _ = fs::remove_file(path);
                  }
              }
          }

'''
          if text.count(cleanup_method_marker) != 1:
              raise SystemExit('cleanup method marker mismatch')
          text = text.replace(cleanup_method_marker, new_methods + cleanup_method_marker)

          old_predicate = '''    path.file_name()
              .and_then(|name| name.to_str())
              .is_some_and(|name| {
                  name.starts_with(GENERATION_PREFIX) && name.ends_with(GENERATION_SUFFIX)
              })
          }

          fn is_history_file(path: &Path) -> bool {
              path.file_name()
                  .and_then(|name| name.to_str())
                  .is_some_and(|name| {
                      name.starts_with(GENERATION_PREFIX)
                          && (name.ends_with(GENERATION_SUFFIX) || name.ends_with(TEMP_SUFFIX))
                  })
          }
'''
          new_predicate = '''    path.file_name()
              .and_then(|name| name.to_str())
              .is_some_and(|name| {
                  name.starts_with(GENERATION_PREFIX)
                      && (name.ends_with(GENERATION_SUFFIX)
                          || name.ends_with(LEGACY_GENERATION_SUFFIX))
              })
          }

          fn is_history_file(path: &Path) -> bool {
              path.file_name()
                  .and_then(|name| name.to_str())
                  .is_some_and(|name| {
                      name.starts_with(GENERATION_PREFIX)
                          && (name.ends_with(GENERATION_SUFFIX)
                              || name.ends_with(LEGACY_GENERATION_SUFFIX)
                              || name.ends_with(TEMP_SUFFIX))
                  })
          }
'''
          if text.count(old_predicate) != 1:
              raise SystemExit('generation predicate marker mismatch')
          text = text.replace(old_predicate, new_predicate)

          command_marker = '''#[tauri::command]
          pub fn history_save_report(
'''
          protection_command = '''#[tauri::command]
          pub fn history_protection_status(
              app: AppHandle,
              state: State<'_, HistoryStorageState>,
          ) -> HistoryProtectionSnapshot {
              let _guard = match state.gate.lock() {
                  Ok(guard) => guard,
                  Err(_) => {
                      return HistoryProtectionSnapshot {
                          status: HistoryProtectionStatus::Unavailable,
                          dpapi_generations: 0,
                          plaintext_generations: 0,
                          message: Some("History storage lock повреждён.".to_string()),
                      }
                  }
              };
              let directory = match app.path().app_data_dir() {
                  Ok(path) => path.join(HISTORY_DIRECTORY),
                  Err(error) => {
                      return HistoryProtectionSnapshot {
                          status: HistoryProtectionStatus::Unavailable,
                          dpapi_generations: 0,
                          plaintext_generations: 0,
                          message: Some(format!("Не удалось определить app-data каталог: {error}")),
                      }
                  }
              };
              HistoryStore::new(directory).protection_status()
          }

'''
          if text.count(command_marker) != 1:
              raise SystemExit('history command marker mismatch')
          text = text.replace(command_marker, protection_command + command_marker)

          test_marker = '''    #[test]
              fn rewrite_all_updates_existing_safe_store_for_policy_enforcement() {
'''
          tests = '''    #[cfg(windows)]
              #[test]
              fn published_generation_is_dpapi_protected_and_round_trips() {
                  let temp = TempDir::new().unwrap();
                  let store = HistoryStore::new(temp.path().join("history"));
                  let saved = store.save_report(sample_report("secret-report"));
                  assert_eq!(saved.status, HistoryStorageStatus::Ready);
                  let generation = saved.generation.unwrap();
                  let raw = fs::read(store.directory.join(generation)).unwrap();
                  assert!(is_dpapi_payload(&raw));
                  assert!(!raw.windows(b"secret-report".len()).any(|window| window == b"secret-report"));
                  assert_eq!(store.protection_status().status, HistoryProtectionStatus::DpapiCurrentUser);
                  assert_eq!(store.load().reports[0].id, "secret-report");
              }

              #[cfg(windows)]
              #[test]
              fn plaintext_generation_is_migrated_and_removed_after_rewrite() {
                  let temp = TempDir::new().unwrap();
                  let directory = temp.path().join("history");
                  fs::create_dir_all(&directory).unwrap();
                  let legacy_path = directory.join(format!(
                      "{GENERATION_PREFIX}00000000000000000001-legacy{LEGACY_GENERATION_SUFFIX}"
                  ));
                  let envelope = HistoryEnvelope {
                      storage_version: HISTORY_STORAGE_VERSION,
                      report_schema_version: REPORT_SCHEMA_VERSION,
                      saved_at: Utc::now().to_rfc3339(),
                      reports: vec![sample_report("legacy")],
                  };
                  fs::write(&legacy_path, serde_json::to_vec(&envelope).unwrap()).unwrap();
                  let store = HistoryStore::new(directory);
                  assert_eq!(store.load().reports[0].id, "legacy");
                  assert_eq!(store.protection_status().status, HistoryProtectionStatus::Plaintext);
                  let rewritten = store.rewrite_all(vec![sample_report("legacy")]);
                  assert!(rewritten.persisted);
                  assert!(!legacy_path.exists());
                  assert_eq!(store.protection_status().status, HistoryProtectionStatus::DpapiCurrentUser);
                  assert_eq!(store.load().reports[0].id, "legacy");
              }

'''
          if text.count(test_marker) != 1:
              raise SystemExit('rewrite test marker mismatch')
          text = text.replace(test_marker, tests + test_marker)
          path.write_text(text, encoding='utf-8', newline='\n')

          lib = Path('apps/desktop/src-tauri/src/lib.rs')
          lib_text = lib.read_text(encoding='utf-8')
          module_marker = '''mod analysis;
          #[cfg(not(feature = "fuzzing"))]
          mod history_storage;
'''
          module_replacement = '''mod analysis;
          #[cfg(not(feature = "fuzzing"))]
          mod history_protection;
          #[cfg(not(feature = "fuzzing"))]
          mod history_storage;
'''
          if lib_text.count(module_marker) != 1:
              raise SystemExit('history module marker mismatch')
          lib_text = lib_text.replace(module_marker, module_replacement)
          handler_marker = '''            history_storage::history_inspect,
                      history_storage::history_save_report,
'''
          handler_replacement = '''            history_storage::history_inspect,
                      history_storage::history_protection_status,
                      history_storage::history_save_report,
'''
          if lib_text.count(handler_marker) != 1:
              raise SystemExit('handler marker mismatch')
          lib.write_text(lib_text.replace(handler_marker, handler_replacement), encoding='utf-8', newline='\n')

      - name: Обновить lockfile только для нового direct dependency
        working-directory: apps/desktop/src-tauri
        run: cargo check

      - name: Форматировать Rust
        working-directory: apps/desktop/src-tauri
        run: cargo fmt --all

      - name: Запустить Rust tests
        working-directory: apps/desktop/src-tauri
        run: cargo test --locked

      - name: Проверить Rust
        working-directory: apps/desktop/src-tauri
        run: cargo check --locked

      - name: Проверить diff
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff -- apps/desktop/src-tauri/Cargo.lock apps/desktop/src-tauri/src/history_protection.rs apps/desktop/src-tauri/src/history_storage.rs apps/desktop/src-tauri/src/lib.rs

      - name: Сохранить готовую DPAPI интеграцию
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/desktop/src-tauri/Cargo.lock apps/desktop/src-tauri/src/history_protection.rs apps/desktop/src-tauri/src/history_storage.rs apps/desktop/src-tauri/src/lib.rs
          git commit -m "feat: защитить history generations через Windows DPAPI"
          git push origin HEAD:tmp/v040-lock-refresh
