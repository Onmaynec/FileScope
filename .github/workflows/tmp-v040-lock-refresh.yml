name: Temporary v0.4.0 Cargo.lock refresh

on:
  push:
    branches:
      - tmp/v040-lock-refresh

permissions:
  contents: write

jobs:
  refresh-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Получить временную ветку
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: tmp/v040-lock-refresh
          fetch-depth: 0

      - name: Изменить только версию корневого crate
        shell: python
        run: |
          from pathlib import Path

          path = Path('apps/desktop/src-tauri/Cargo.lock')
          text = path.read_text(encoding='utf-8')
          old = '[[package]]\nname = "filescope"\nversion = "0.3.4"\n'
          new = '[[package]]\nname = "filescope"\nversion = "0.4.0"\n'
          if text.count(old) != 1:
              raise SystemExit('Expected exactly one filescope 0.3.4 root package block')
          updated = text.replace(old, new)
          path.write_text(updated, encoding='utf-8', newline='\n')

      - name: Проверить минимальный diff и сохранить lockfile
        shell: bash
        run: |
          set -euo pipefail
          git diff -- apps/desktop/src-tauri/Cargo.lock
          changed_lines="$(git diff --numstat -- apps/desktop/src-tauri/Cargo.lock | awk '{print $1+$2}')"
          test "$changed_lines" = "2"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/desktop/src-tauri/Cargo.lock
          git commit -m "chore: refresh Cargo.lock for v0.4.0"
          git push origin HEAD:tmp/v040-lock-refresh
