name: Одноразовая полировка v0.3.3

on:
  push:
    branches: [fix/0.3.3-bugfix]
    paths:
      - '.github/workflows/v033-final-code-polish.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/0.3.3-bugfix
          fetch-depth: 0
      - name: Устранить hardcoded version и расширить тесты
        run: |
          python - <<'PY'
          from pathlib import Path

          workspace = Path('apps/desktop/src/features/analysis/ui/AnalysisWorkspace.tsx')
          text = workspace.read_text(encoding='utf-8')
          old_import = "import { selectLocalObjects } from '../../../shared/native/native-bridge';"
          new_import = "import { APP_VERSION } from '../../../shared/config/app-version';\nimport { selectLocalObjects } from '../../../shared/native/native-bridge';"
          if old_import not in text:
              raise SystemExit('workspace import marker missing')
          text = text.replace(old_import, new_import, 1)
          text = text.replace(
              "useState('Перетащите файлы сюда или откройте файловый диалог.')",
              "useState('Перетащите файлы сюда или загрузите их вручную.')",
              1,
          )
          text = text.replace(
              '<span className="analysis-kicker">FileScope Core 0.3.3</span>',
              '<span className="analysis-kicker">FileScope Core {APP_VERSION}</span>',
              1,
          )
          workspace.write_text(text, encoding='utf-8')

          file_rs = Path('apps/desktop/src-tauri/src/analysis/file.rs')
          text = file_rs.read_text(encoding='utf-8')
          marker = '''    #[test]\n    fn cancellation_stops_before_reading() {'''
          block = '''    #[test]\n    fn size_limit_stops_before_hashing() {\n        let mut file = NamedTempFile::new().unwrap();\n        file.write_all(&vec![1_u8; 2048]).unwrap();\n        let mut limits = AnalysisLimits::default();\n        limits.maximum_file_size_bytes = 1024;\n        let report = analyze_file(\n            file.path().to_string_lossy().to_string(),\n            limits,\n            &token(),\n        )\n        .unwrap();\n        assert_eq!(report.analysis_completeness, AnalysisCompleteness::StoppedByLimit);\n        assert!(report.sha256.is_none());\n    }\n\n    #[cfg(unix)]\n    #[test]\n    fn rejects_symbolic_links() {\n        use std::os::unix::fs::symlink;\n        let directory = tempfile::tempdir().unwrap();\n        let target = directory.path().join("target.bin");\n        let link = directory.path().join("link.bin");\n        std::fs::write(&target, b"content").unwrap();\n        symlink(&target, &link).unwrap();\n        let error = analyze_file(\n            link.to_string_lossy().to_string(),\n            AnalysisLimits::default(),\n            &token(),\n        )\n        .unwrap_err();\n        assert_eq!(error.code, AnalysisFailureCode::UnsupportedObject);\n    }\n\n'''
          if marker not in text:
              raise SystemExit('file test marker missing')
          text = text.replace(marker, block + marker, 1)
          file_rs.write_text(text, encoding='utf-8')

          url_rs = Path('apps/desktop/src-tauri/src/analysis/url.rs')
          text = url_rs.read_text(encoding='utf-8')
          marker = '''    #[test]\n    fn rejects_non_http_and_bidi_urls() {'''
          block = '''    #[test]\n    fn corpus_normalizes_trailing_dot_default_port_and_percent_encoding() {\n        let report = analyze_url_passive(\n            "https://deep.example.co.uk.:443/a%20b?next=https%3A%2F%2Fsafe.example".to_string(),\n            &token(),\n        )\n        .unwrap();\n        let details = report.url.unwrap();\n        assert_eq!(details.ascii_host, "deep.example.co.uk");\n        assert_eq!(details.registrable_domain.as_deref(), Some("example.co.uk"));\n        assert_eq!(details.port, Some(443));\n        assert_eq!(details.subdomain_count, 1);\n        assert_eq!(details.redirect_parameters.len(), 1);\n    }\n\n    #[test]\n    fn rejects_ambiguous_numeric_and_excessively_long_urls() {\n        assert!(parse_http_url("http://2130706433/").is_err());\n        let long = format!("https://example.com/{}", "a".repeat(MAXIMUM_URL_LENGTH));\n        assert!(parse_http_url(&long).is_err());\n    }\n\n    #[test]\n    fn mapped_public_ipv6_is_allowed_but_mapped_loopback_is_blocked() {\n        assert!(!is_forbidden_ip("::ffff:93.184.216.34".parse().unwrap()));\n        assert!(is_forbidden_ip("::ffff:127.0.0.1".parse().unwrap()));\n    }\n\n'''
          if marker not in text:
              raise SystemExit('url test marker missing')
          text = text.replace(marker, block + marker, 1)
          url_rs.write_text(text, encoding='utf-8')
          PY
          cd apps/desktop/src-tauri
          cargo fmt --all
      - name: Удалить workflow и зафиксировать изменения
        run: |
          rm .github/workflows/v033-final-code-polish.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/desktop/src/features/analysis/ui/AnalysisWorkspace.tsx apps/desktop/src-tauri/src/analysis/file.rs apps/desktop/src-tauri/src/analysis/url.rs
          git add -u .github/workflows/v033-final-code-polish.yml
          git commit -m 'test(regression): расширить corpus FileScope v0.3.3'
          git push origin HEAD:fix/0.3.3-bugfix
