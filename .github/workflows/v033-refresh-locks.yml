name: Одноразовая подготовка lock-файлов v0.3.3

on:
  push:
    branches: [fix/0.3.3-bugfix]
    paths:
      - '.github/workflows/v033-refresh-locks.yml'

permissions:
  contents: write

jobs:
  refresh:
    name: Обновить lock-файлы и rustfmt
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Получить рабочую ветку
        uses: actions/checkout@v4
        with:
          ref: fix/0.3.3-bugfix
          fetch-depth: 0

      - name: Установить Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Установить pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.14.0

      - name: Установить Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Обновить pnpm-lock.yaml
        run: pnpm install --lockfile-only --ignore-scripts

      - name: Обновить Cargo.lock и форматировать Rust
        working-directory: apps/desktop/src-tauri
        run: |
          cargo generate-lockfile
          cargo fmt --all

      - name: Удалить одноразовый workflow и зафиксировать результат
        run: |
          rm .github/workflows/v033-refresh-locks.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pnpm-lock.yaml apps/desktop/src-tauri/Cargo.lock apps/desktop/src-tauri/src apps/desktop/src-tauri/Cargo.toml
          git add -u .github/workflows/v033-refresh-locks.yml
          git commit -m 'chore(lock): обновить зависимости FileScope v0.3.3'
          git push origin HEAD:fix/0.3.3-bugfix
