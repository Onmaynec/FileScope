name: Temporary v0.4.0 history settings UI patch

on:
  push:
    branches:
      - tmp/v040-lock-refresh

permissions:
  contents: write

jobs:
  patch-ui:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Получить временную ветку
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: tmp/v040-lock-refresh
          fetch-depth: 0

      - name: Подключить HistoryPrivacySettings
        shell: python
        run: |
          from pathlib import Path
          path = Path('apps/desktop/src/app/v020/V020App.tsx')
          text = path.read_text(encoding='utf-8')
          import_marker = "import { AnalysisSettings } from '../../features/analysis/ui/AnalysisSettings';\n"
          import_replacement = import_marker + "import { HistoryPrivacySettings } from '../../features/analysis/ui/HistoryPrivacySettings';\n"
          render_marker = '</section><AnalysisSettings value={limits} onChange={setLimits} /></>;'
          render_replacement = '</section><HistoryPrivacySettings /><AnalysisSettings value={limits} onChange={setLimits} /></>;'
          if text.count(import_marker) != 1:
              raise SystemExit('AnalysisSettings import marker mismatch')
          if text.count(render_marker) != 1:
              raise SystemExit('SettingsPage render marker mismatch')
          text = text.replace(import_marker, import_replacement).replace(render_marker, render_replacement)
          path.write_text(text, encoding='utf-8', newline='\n')

      - name: Сохранить UI patch
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff -- apps/desktop/src/app/v020/V020App.tsx
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/desktop/src/app/v020/V020App.tsx
          git commit -m "feat: подключить privacy retention settings UI"
          git push origin HEAD:tmp/v040-lock-refresh
