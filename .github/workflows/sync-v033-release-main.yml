name: Одноразовая синхронизация release v0.3.3 с main

on:
  push:
    branches: [release/0.3.3-publish]
    paths:
      - '.github/.sync-v033-release-main'

permissions:
  contents: write

concurrency:
  group: sync-v033-release-main
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Получить release-ветку
        uses: actions/checkout@v4
        with:
          ref: release/0.3.3-publish
          fetch-depth: 0

      - name: Синхронизировать историю без изменения дерева v0.3.3
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main

          rm -f .github/.sync-v033-release-main
          rm -f .github/workflows/sync-v033-release-main.yml
          git add -A
          git commit -m 'chore(release): удалить временную синхронизацию'

          git merge --strategy=ours --no-ff origin/main \
            -m 'merge: синхронизировать историю main для релиза v0.3.3'

          git push origin HEAD:release/0.3.3-publish
