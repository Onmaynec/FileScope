name: Одноразовый rustfmt FileScope v0.3.3

on:
  push:
    branches: [fix/0.3.3-bugfix]
    paths:
      - '.github/workflows/v033-rustfmt.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/0.3.3-bugfix
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Применить официальный rustfmt
        working-directory: apps/desktop/src-tauri
        run: cargo fmt --all
      - name: Удалить workflow и зафиксировать форматирование
        run: |
          rm .github/workflows/v033-rustfmt.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/desktop/src-tauri/src
          git add -u .github/workflows/v033-rustfmt.yml
          git commit -m 'style(rust): применить rustfmt для FileScope v0.3.3'
          git push origin HEAD:fix/0.3.3-bugfix
