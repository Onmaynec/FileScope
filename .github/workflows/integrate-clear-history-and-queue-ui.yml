name: Одноразовая интеграция истории и UI очереди

on:
  push:
    branches: [integration/clear-history-and-queue-ui]
    paths:
      - '.github/workflows/integrate-clear-history-and-queue-ui.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/clear-history-and-queue-ui
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Подготовить исходную feature-ветку
        run: git fetch origin feature/clear-report-history:refs/remotes/origin/feature/clear-report-history

      - name: Применить адаптацию
        run: python scripts/integrate-clear-history-and-queue-ui.py

      - name: Проверить frontend
        run: |
          npm install --global pnpm@10.14.0
          pnpm install --frozen-lockfile
          pnpm --filter @filescope/desktop lint
          pnpm --filter @filescope/desktop typecheck
          pnpm --filter @filescope/desktop test

      - name: Зафиксировать интеграцию
        shell: bash
        run: |
          rm scripts/integrate-clear-history-and-queue-ui.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/desktop/src/features/analysis/ui/ReportHistory.tsx
          git add apps/desktop/src/features/analysis/model/analysis-storage.ts
          git add apps/desktop/src/features/analysis/model/analysis-storage.test.ts
          git add apps/desktop/src/shared/styles/v033-bugfix.css
          git add apps/desktop/tests/e2e/app.spec.ts
          git add -u .github/.integration-placeholder docs/worklogs/v0.3.3-integration.md scripts/integrate-clear-history-and-queue-ui.py
          git commit -m 'fix(ui): интегрировать очистку истории и исправить очередь'
          git push origin HEAD:integration/clear-history-and-queue-ui
