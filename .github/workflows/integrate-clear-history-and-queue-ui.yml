name: Одноразовая интеграция истории и UI очереди

on:
  push:
    branches: [integration/clear-history-and-queue-ui]
    paths:
      - '.github/workflows/integrate-clear-history-and-queue-ui.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/clear-history-and-queue-ui
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Установить pnpm
        run: npm install --global pnpm@10.14.0

      - name: Интегрировать изменения поверх FileScope 0.3.3
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          report_history = r'''import { useEffect, useMemo, useRef, useState } from 'react';
          import { FileJson2, Search, ShieldCheck, Trash2 } from 'lucide-react';
          import { clearReports, deleteReport, loadReports } from '../model/analysis-storage';
          import { riskLabels, type AnalysisReport, type ObjectKind, type RiskLevel } from '../model/types';
          import { ReportView } from './ReportView';

          export function ReportHistory() {
            const [reports, setReports] = useState<AnalysisReport[]>(() => loadReports());
            const [query, setQuery] = useState('');
            const [kind, setKind] = useState<'all' | ObjectKind>('all');
            const [risk, setRisk] = useState<'all' | RiskLevel>('all');
            const [selected, setSelected] = useState<AnalysisReport | null>(null);
            const [clearConfirmationOpen, setClearConfirmationOpen] = useState(false);
            const cancelClearRef = useRef<HTMLButtonElement>(null);

            useEffect(() => {
              if (clearConfirmationOpen) cancelClearRef.current?.focus();
            }, [clearConfirmationOpen]);

            const filtered = useMemo(() => reports.filter((report) => {
              const matchesQuery = `${report.displayName} ${report.target} ${report.sha256 ?? ''}`
                .toLocaleLowerCase('ru-RU')
                .includes(query.toLocaleLowerCase('ru-RU'));
              return matchesQuery
                && (kind === 'all' || report.objectKind === kind)
                && (risk === 'all' || report.riskLevel === risk);
            }), [reports, query, kind, risk]);

            const remove = (id: string) => {
              const next = deleteReport(id);
              setReports(next);
              if (selected?.id === id) setSelected(null);
            };

            const clearHistory = () => {
              setReports(clearReports());
              setSelected(null);
              setClearConfirmationOpen(false);
            };

            if (selected) {
              return <div className="analysis-history">
                <button type="button" className="text-button" onClick={() => setSelected(null)}>← Вернуться к истории</button>
                <ReportView report={selected} />
              </div>;
            }

            return <div className="analysis-history">
              <section className="analysis-history__toolbar card">
                <label className="analysis-search">
                  <Search />
                  <input
                    className="input"
                    value={query}
                    onChange={(event) => setQuery(event.target.value)}
                    placeholder="Поиск по имени, пути или SHA-256"
                    aria-label="Поиск по истории отчётов"
                  />
                </label>
                <select
                  className="input compact"
                  value={kind}
                  onChange={(event) => setKind(event.target.value as 'all' | ObjectKind)}
                  aria-label="Фильтр истории по типу объекта"
                >
                  <option value="all">Все объекты</option>
                  <option value="file">Файлы</option>
                  <option value="url">URL</option>
                  <option value="archive">Архивы</option>
                </select>
                <select
                  className="input compact"
                  value={risk}
                  onChange={(event) => setRisk(event.target.value as 'all' | RiskLevel)}
                  aria-label="Фильтр истории по уровню риска"
                >
                  <option value="all">Все уровни риска</option>
                  <option value="noThreatsFound">Без обнаруженных признаков</option>
                  <option value="caution">Требует внимания</option>
                  <option value="highRisk">Высокий риск</option>
                  <option value="dangerous">Опасный объект</option>
                </select>
                {reports.length > 0 && <button
                  type="button"
                  className="button button-secondary analysis-history__clear"
                  onClick={() => setClearConfirmationOpen(true)}
                ><Trash2 />Очистить историю</button>}
              </section>

              {clearConfirmationOpen && <section
                className="analysis-history__confirmation card"
                role="alertdialog"
                aria-modal="true"
                aria-labelledby="clear-history-title"
                aria-describedby="clear-history-description"
                onKeyDown={(event) => {
                  if (event.key === 'Escape') setClearConfirmationOpen(false);
                }}
              >
                <div className="analysis-history__confirmation-content">
                  <strong id="clear-history-title">Очистить всю историю?</strong>
                  <p id="clear-history-description">
                    Все локально сохранённые отчёты будут удалены без возможности восстановления.
                    Резервная копия миграции и настройки анализа останутся нетронутыми.
                  </p>
                </div>
                <div className="analysis-history__confirmation-actions">
                  <button
                    ref={cancelClearRef}
                    type="button"
                    className="button button-secondary"
                    onClick={() => setClearConfirmationOpen(false)}
                  >Отмена</button>
                  <button type="button" className="button button-danger" onClick={clearHistory}>
                    <Trash2 />Удалить все отчёты
                  </button>
                </div>
              </section>}

              {filtered.length === 0 ? <section className="card empty analysis-history__empty">
                <FileJson2 size={42} />
                <h2>{reports.length === 0 ? 'Отчётов пока нет' : 'Ничего не найдено'}</h2>
                <p>{reports.length === 0
                  ? 'Выполните локальную проверку файла, URL или ZIP-архива. Результаты сохраняются только на этом устройстве.'
                  : 'Измените поисковый запрос или выбранные фильтры.'}</p>
              </section> : <section className="analysis-report-grid">{filtered.map((report) => <article className={`analysis-report-card risk-${report.riskLevel}`} key={report.id}>
                <button type="button" className="analysis-report-card__body" onClick={() => setSelected(report)}>
                  <div className="analysis-report-card__icon"><ShieldCheck /></div>
                  <div><strong>{report.displayName}</strong><span>{report.detectedType ?? report.objectKind} · {new Date(report.completedAt).toLocaleString('ru-RU')}</span><b>{riskLabels[report.riskLevel]} · {report.riskScore}/100</b></div>
                </button>
                <button type="button" className="icon-button danger" onClick={() => remove(report.id)} aria-label={`Удалить отчёт «${report.displayName}»`}><Trash2 /></button>
              </article>)}</section>}
            </div>;
          }
          '''
          Path('apps/desktop/src/features/analysis/ui/ReportHistory.tsx').write_text(report_history, encoding='utf-8')

          storage_path = Path('apps/desktop/src/features/analysis/model/analysis-storage.ts')
          storage = storage_path.read_text(encoding='utf-8')
          storage, count = re.subn(
              r"export function clearReports\(\): void \{.*?\n\}\n\nexport function loadAnalysisLimits",
              """export function clearReports(): AnalysisReport[] {
            if (typeof localStorage !== 'undefined') {
              localStorage.removeItem(REPORTS_KEY);
              for (const key of LEGACY_REPORT_KEYS) localStorage.removeItem(key);
            }
            return [];
          }

          export function loadAnalysisLimits""",
              storage,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit('Не найден clearReports для адаптации')
          storage_path.write_text(storage, encoding='utf-8')

          workspace_path = Path('apps/desktop/src/features/analysis/ui/AnalysisWorkspace.tsx')
          workspace = workspace_path.read_text(encoding='utf-8')
          if 'const rowHeight = 76;' not in workspace:
              raise SystemExit('Не найден rowHeight виртуальной очереди')
          workspace = workspace.replace('const rowHeight = 76;', 'const rowHeight = 96;', 1)
          queue_row = r'''function QueueRow({ item, selected, active, style, onSelect, onRemove, onRetry }: {
            item: AnalysisQueueItem;
            selected: boolean;
            active: boolean;
            style: React.CSSProperties;
            onSelect: () => void;
            onRemove: () => void;
            onRetry: () => void;
          }) {
            const StatusIcon = item.status === 'completed' ? CheckCircle2 : item.status === 'failed' ? XCircle : item.status === 'running' || item.status === 'cancelling' ? LoaderCircle : item.status === 'cancelled' ? Square : Clock3;
            const metadata = `${objectLabel(item.kind)}${item.kind === 'url' ? ` · ${item.activeNetwork ? 'активная' : 'пассивная'}` : ''} · ${statusLabels[item.status]}`;
            return <article style={style} className={`analysis-queue-item status-${item.status} ${active ? 'active' : ''} ${selected ? 'selected' : ''}`}>
              <span className="analysis-queue-item__status" aria-hidden="true"><StatusIcon /></span>
              <button
                type="button"
                className="analysis-queue-item__body"
                title={item.target}
                aria-label={`Открыть детали «${item.displayName}»`}
                onClick={onSelect}
              >
                <strong title={item.displayName}>{item.displayName}</strong>
                <span title={metadata}>{metadata}</span>
                {item.riskScore !== undefined && <small className={`risk-${item.riskLevel}`}>{item.riskScore}/100</small>}
                {item.error && <small className="analysis-queue-item__error" title={item.error}>{item.error}</small>}
              </button>
              {(item.status === 'failed' || item.status === 'cancelled') && <button
                type="button"
                className="icon-button"
                title="Повторить"
                aria-label={`Повторить «${item.displayName}»`}
                onClick={onRetry}
              ><RefreshCcw /></button>}
              {item.status !== 'running' && item.status !== 'cancelling' && <button
                type="button"
                className="icon-button danger"
                title="Убрать из очереди"
                aria-label={`Убрать «${item.displayName}» из очереди`}
                onClick={onRemove}
              ><Trash2 /></button>}
            </article>;
          }
          '''
          workspace, count = re.subn(
              r"function QueueRow\(.*?\n\}\n\nfunction QueueItemDetails",
              queue_row + '\nfunction QueueItemDetails',
              workspace,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit('Не найден QueueRow для адаптации')
          workspace_path.write_text(workspace, encoding='utf-8')

          css_path = Path('apps/desktop/src/shared/styles/v033-bugfix.css')
          css = css_path.read_text(encoding='utf-8')
          css, count = re.subn(
              r"\.analysis-queue-virtual \.analysis-queue-item \{\n  position: absolute;\n  inset: 0 5px auto 5px;\n  height: 70px;\n  margin-top: 3px;\n\}",
              ".analysis-queue-virtual .analysis-queue-item {\n  position: absolute;\n  inset: 0 5px auto 5px;\n  height: 90px;\n  margin-top: 3px;\n}",
              css,
              count=1,
          )
          if count != 1:
              raise SystemExit('Не найден CSS-блок виртуальной строки')
          marker = '/* integration: report history cleanup and readable virtual queue rows */'
          if marker not in css:
              css += r'''

          /* integration: report history cleanup and readable virtual queue rows */
          .analysis-history__clear {
            flex: 0 0 auto;
            margin-left: auto;
            white-space: nowrap;
          }
          .analysis-history__confirmation {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            border-color: rgba(239, 68, 68, .42);
            background: color-mix(in srgb, #ef4444 7%, var(--surface));
          }
          .analysis-history__confirmation-content {
            min-width: 0;
            display: grid;
            gap: 6px;
          }
          .analysis-history__confirmation-content p {
            max-width: 760px;
            margin: 0;
            color: var(--secondary);
            line-height: 1.5;
          }
          .analysis-history__confirmation-actions {
            flex: 0 0 auto;
            display: flex;
            align-items: center;
            gap: 8px;
          }
          .analysis-queue-item__status {
            flex: 0 0 44px;
            width: 44px;
          }
          .analysis-queue-item__body {
            align-self: stretch;
            min-height: 0;
            gap: 2px;
            padding: 7px 4px;
            overflow: hidden;
          }
          .analysis-queue-item__body strong {
            min-width: 0;
            display: -webkit-box;
            overflow: hidden;
            -webkit-box-orient: vertical;
            -webkit-line-clamp: 2;
            line-clamp: 2;
            font-size: 14px;
            line-height: 1.25;
            overflow-wrap: anywhere;
          }
          .analysis-queue-item__body span,
          .analysis-queue-item__body small {
            min-width: 0;
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
            line-height: 1.3;
          }
          .analysis-queue-item__body span { font-size: 12px; }
          .analysis-queue-item__body small { font-size: 12px; }
          .analysis-queue-item__body .analysis-queue-item__error { color: #f87171; }
          .analysis-queue-item > .icon-button {
            flex: 0 0 34px;
            width: 34px;
            height: 34px;
            margin-right: 2px;
          }
          .analysis-queue-item > .icon-button svg { width: 17px; height: 17px; }

          @media (max-width: 1050px) {
            .analysis-history__clear { width: 100%; margin-left: 0; }
            .analysis-history__confirmation { align-items: stretch; flex-direction: column; }
            .analysis-history__confirmation-actions { justify-content: flex-end; }
          }

          @media (max-width: 560px) {
            .analysis-history__confirmation-actions { align-items: stretch; flex-direction: column-reverse; }
            .analysis-history__confirmation-actions .button { width: 100%; }
          }

          @media (forced-colors: active) {
            .analysis-queue-item.selected { outline: 2px solid Highlight; outline-offset: -2px; }
            .analysis-history__confirmation { border: 2px solid CanvasText; }
          }
          '''
          css_path.write_text(css, encoding='utf-8')

          test_path = Path('apps/desktop/src/features/analysis/model/analysis-storage.test.ts')
          tests = test_path.read_text(encoding='utf-8')
          tests = tests.replace(
              "import { describe, expect, it } from 'vitest';",
              "import { beforeEach, describe, expect, it } from 'vitest';",
              1,
          )
          tests = tests.replace(
              "import { migrateReport, sanitizeLimits } from './analysis-storage';",
              "import { clearReports, migrateReport, sanitizeLimits } from './analysis-storage';",
              1,
          )
          if "beforeEach(() => localStorage.clear());" not in tests:
              tests = tests.replace(
                  "import { currentReportSchemaVersion, defaultAnalysisLimits } from './types';\n",
                  "import { currentReportSchemaVersion, defaultAnalysisLimits } from './types';\n\nbeforeEach(() => localStorage.clear());\n",
                  1,
              )
          clear_test = r'''

          describe('очистка истории', () => {
            it('удаляет current и legacy отчёты, сохраняя migration backup и настройки', () => {
              localStorage.setItem('filescope:reports:schema-1', '[{"id":"current"}]');
              localStorage.setItem('filescope:v0.2.0:reports', '[{"id":"legacy"}]');
              localStorage.setItem('filescope:migration-backup:v0.3.3', '{"legacy":"backup"}');
              localStorage.setItem('filescope:limits:v1', '{"jobTimeoutMs":30000}');

              expect(clearReports()).toEqual([]);
              expect(localStorage.getItem('filescope:reports:schema-1')).toBeNull();
              expect(localStorage.getItem('filescope:v0.2.0:reports')).toBeNull();
              expect(localStorage.getItem('filescope:migration-backup:v0.3.3')).toBe('{"legacy":"backup"}');
              expect(localStorage.getItem('filescope:limits:v1')).toBe('{"jobTimeoutMs":30000}');
            });
          });
          '''
          if "describe('очистка истории'" not in tests:
              insert_at = tests.index("\ndescribe('миграция отчётов'")
              tests = tests[:insert_at] + clear_test + tests[insert_at:]
          test_path.write_text(tests, encoding='utf-8')

          e2e_path = Path('apps/desktop/tests/e2e/app.spec.ts')
          e2e = e2e_path.read_text(encoding='utf-8')
          e2e_tests = r'''

          test('длинное имя в виртуальной очереди не обрезает метаданные карточки', async ({ page }) => {
            await page.getByRole('button', { name: 'Ссылки', exact: true }).click();
            await page.getByLabel('Адрес').fill('https://screen-shot-2026-08-06-102144.very-long-layout-regression-name.example.com/download');
            await page.getByRole('button', { name: 'Добавить URL в очередь' }).click();

            const row = page.locator('.analysis-queue-item').first();
            await expect(row).toBeVisible();
            await expect(row.locator('strong')).toHaveAttribute('title', /screen-shot-2026-08-06/);

            const layout = await row.evaluate((element) => {
              const title = element.querySelector('strong');
              const metadata = element.querySelector('.analysis-queue-item__body span');
              const rowRect = element.getBoundingClientRect();
              const titleRect = title?.getBoundingClientRect();
              const metadataRect = metadata?.getBoundingClientRect();
              const titleStyle = title ? getComputedStyle(title) : null;
              return {
                rowHeight: rowRect.height,
                rowBottom: rowRect.bottom,
                contentBottom: Math.max(titleRect?.bottom ?? 0, metadataRect?.bottom ?? 0),
                titleOverflow: titleStyle?.overflow,
                lineClamp: titleStyle?.webkitLineClamp,
              };
            });

            expect(layout.rowHeight).toBeGreaterThanOrEqual(88);
            expect(layout.contentBottom).toBeLessThanOrEqual(layout.rowBottom + 1);
            expect(layout.titleOverflow).toBe('hidden');
            expect(layout.lineClamp).toBe('2');
          });

          test('очистка истории требует подтверждение и не удаляет migration backup', async ({ page }) => {
            await page.evaluate(() => {
              const report = {
                schemaVersion: 1,
                appVersion: '0.3.3',
                analyzerVersion: '0.3.3',
                ruleSetVersion: '2026.08.06',
                createdBy: { platform: 'windows', architecture: 'x64', runtime: 'test' },
                analysisCompleteness: 'complete',
                id: 'history-clear-test',
                objectKind: 'file',
                target: 'C:/Temp/Снимок экрана 2026-08-06 102144.png',
                displayName: 'Снимок экрана 2026-08-06 102144.png',
                startedAt: '2026-08-06T10:21:44Z',
                completedAt: '2026-08-06T10:21:45Z',
                durationMs: 1000,
                sha256: 'a'.repeat(64),
                detectedType: 'PNG image',
                sizeBytes: 1024,
                riskLevel: 'noThreatsFound',
                riskScore: 0,
                indicators: [],
                metadata: {},
                isDemo: false,
                limitations: [],
              };
              localStorage.setItem('filescope:reports:schema-1', JSON.stringify([report]));
              localStorage.setItem('filescope:v0.2.0:reports', JSON.stringify([report]));
              localStorage.setItem('filescope:migration-backup:v0.3.3', '{"preserve":true}');
            });
            await page.reload();
            await page.getByRole('button', { name: 'Отчёты', exact: true }).click();
            await expect(page.getByText('Снимок экрана 2026-08-06 102144.png')).toBeVisible();

            await page.getByRole('button', { name: 'Очистить историю', exact: true }).click();
            const firstDialog = page.getByRole('alertdialog', { name: 'Очистить всю историю?' });
            await expect(firstDialog).toBeVisible();
            await firstDialog.getByRole('button', { name: 'Отмена' }).click();
            await expect(page.getByText('Снимок экрана 2026-08-06 102144.png')).toBeVisible();

            await page.getByRole('button', { name: 'Очистить историю', exact: true }).click();
            const confirmation = page.getByRole('alertdialog', { name: 'Очистить всю историю?' });
            await confirmation.getByRole('button', { name: 'Удалить все отчёты' }).click();
            await expect(page.getByRole('heading', { name: 'Отчётов пока нет' })).toBeVisible();

            const storage = await page.evaluate(() => ({
              current: localStorage.getItem('filescope:reports:schema-1'),
              legacy: localStorage.getItem('filescope:v0.2.0:reports'),
              backup: localStorage.getItem('filescope:migration-backup:v0.3.3'),
            }));
            expect(storage.current).toBeNull();
            expect(storage.legacy).toBeNull();
            expect(storage.backup).toBe('{"preserve":true}');
          });
          '''
          if "длинное имя в виртуальной очереди" not in e2e:
              e2e = e2e.replace('\nasync function contrastRatio', e2e_tests + '\nasync function contrastRatio', 1)
          e2e_path.write_text(e2e, encoding='utf-8')

          for temporary in [
              Path('.github/.integration-placeholder'),
              Path('docs/worklogs/v0.3.3-integration.md'),
          ]:
              if temporary.exists():
                  temporary.unlink()
          PY

      - name: Установить зависимости и проверить frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @filescope/desktop lint
          pnpm --filter @filescope/desktop typecheck
          pnpm --filter @filescope/desktop test

      - name: Зафиксировать интеграцию
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/desktop/src/features/analysis/ui/ReportHistory.tsx
          git add apps/desktop/src/features/analysis/model/analysis-storage.ts
          git add apps/desktop/src/features/analysis/model/analysis-storage.test.ts
          git add apps/desktop/src/features/analysis/ui/AnalysisWorkspace.tsx
          git add apps/desktop/src/shared/styles/v033-bugfix.css
          git add apps/desktop/tests/e2e/app.spec.ts
          git add -u .github/.integration-placeholder docs/worklogs/v0.3.3-integration.md
          git commit -m 'fix(ui): интегрировать очистку истории и исправить очередь'
          git push origin HEAD:integration/clear-history-and-queue-ui
