name: Одноразовая коррекция Windows file tests v0.3.3

on:
  push:
    branches: [fix/0.3.3-bugfix]
    paths:
      - '.github/workflows/v033-test-handle-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/0.3.3-bugfix
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Закрыть тестовый writer до анализа
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/desktop/src-tauri/src/analysis/file.rs')
          text = path.read_text(encoding='utf-8')
          old = '''        let mut file = NamedTempFile::new().unwrap();
        file.write_all(b"FileScope test").unwrap();
        let report = analyze_file(
            file.path().to_string_lossy().to_string(),'''
          new = '''        let mut file = NamedTempFile::new().unwrap();
        file.write_all(b"FileScope test").unwrap();
        let path = file.into_temp_path();
        let report = analyze_file(
            path.to_string_lossy().to_string(),'''
          if old not in text:
              raise SystemExit('SHA test fragment missing')
          text = text.replace(old, new, 1)
          old = '''        let mut file = NamedTempFile::new().unwrap();
        file.write_all(&vec![1_u8; 2048]).unwrap();
        let mut limits = AnalysisLimits::default();
        limits.maximum_file_size_bytes = 1024;
        let report =
            analyze_file(file.path().to_string_lossy().to_string(), limits, &token()).unwrap();'''
          new = '''        let mut file = NamedTempFile::new().unwrap();
        file.write_all(&vec![1_u8; 2048]).unwrap();
        let path = file.into_temp_path();
        let mut limits = AnalysisLimits::default();
        limits.maximum_file_size_bytes = 1024;
        let report =
            analyze_file(path.to_string_lossy().to_string(), limits, &token()).unwrap();'''
          if old not in text:
              raise SystemExit('size limit test fragment missing')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          cd apps/desktop/src-tauri
          cargo fmt --all
      - name: Удалить workflow и зафиксировать тесты
        run: |
          rm .github/workflows/v033-test-handle-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/desktop/src-tauri/src/analysis/file.rs
          git add -u .github/workflows/v033-test-handle-fix.yml
          git commit -m 'test(file): закрывать writer перед стабильным чтением Windows'
          git push origin HEAD:fix/0.3.3-bugfix
