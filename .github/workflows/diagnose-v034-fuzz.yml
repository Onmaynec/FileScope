name: Diagnose v0.3.4 fuzz target

on:
  push:
    branches:
      - chore/v0.3.4-readiness
    paths:
      - .github/diagnose-v034-fuzz-trigger

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: chore/v0.3.4-readiness
          fetch-depth: 0
      - name: Install Tauri Linux dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update -o Acquire::Retries=3
          sudo apt-get install -y --no-install-recommends build-essential pkg-config libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev libxdo-dev
      - uses: dtolnay/rust-toolchain@nightly
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --version 0.13.2 --locked
      - name: Capture compiler output
        shell: bash
        run: |
          set +e
          cd apps/desktop/src-tauri
          cargo fuzz build report_deserialization > ../../../.github/v034-fuzz-diagnostic.txt 2>&1
          status=$?
          cd ../../..
          printf '\nexit_status=%s\n' "$status" >> .github/v034-fuzz-diagnostic.txt
          tail -n 250 .github/v034-fuzz-diagnostic.txt > .github/v034-fuzz-diagnostic.tail
          mv .github/v034-fuzz-diagnostic.tail .github/v034-fuzz-diagnostic.txt
          exit 0
      - name: Commit diagnostic tail
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/v034-fuzz-diagnostic.txt
          git commit -m 'chore: сохранить диагностику fuzz target v0.3.4'
          git push origin HEAD:chore/v0.3.4-readiness
