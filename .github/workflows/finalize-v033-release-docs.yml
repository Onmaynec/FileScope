name: Одноразовая финализация документации v0.3.3

on:
  push:
    branches: [release/0.3.3-publish]
    paths:
      - '.github/.finalize-v033-release-docs'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/0.3.3-publish
          fetch-depth: 0

      - name: Финализировать документацию
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main

          python - <<'PY'
          from pathlib import Path

          readme = Path('README.md')
          text = readme.read_text(encoding='utf-8')
          old = '> **Текущая разрабатываемая версия:** `v0.3.3`  \n> **Последний опубликованный релиз:** `v0.3.2`'
          new = '> **Текущая стабильная версия:** `v0.3.3`  \n> **Последний опубликованный релиз:** `v0.3.3`'
          if old not in text:
              raise SystemExit('README release status marker not found')
          readme.write_text(text.replace(old, new, 1), encoding='utf-8')

          changelog = Path('CHANGELOG.md')
          text = changelog.read_text(encoding='utf-8')
          text = text.replace('## [0.3.3] — не выпущено', '## [0.3.3] — 2026-08-06', 1)
          marker = '- drag-and-drop, текст «Загрузить файлы», custom Select и master-detail очередь исправляют UX массовой проверки.\n'
          addition = (
              marker
              + '- добавлена безопасная полная очистка current и legacy истории с сохранением migration backup и настроек;\n'
              + '- длинные имена, метаданные и оценки риска больше не обрезаются в виртуализированной очереди.\n'
          )
          if marker not in text:
              raise SystemExit('CHANGELOG v0.3.3 marker not found')
          changelog.write_text(text.replace(marker, addition, 1), encoding='utf-8')
          PY

          git checkout origin/main -- docs/releases/v0.3.2.md
          rm -f .github/.finalize-v033-release-docs
          rm -f .github/workflows/finalize-v033-release-docs.yml
          git add -A
          git commit -m 'docs(release): финализировать FileScope v0.3.3'
          git push origin HEAD:release/0.3.3-publish
