name: Проверка и сборка FileScope

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [develop]
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # BEGIN TEMP V033 WINDOWS FIXTURE REPAIR
  repair-windows-tests:
    name: Одноразово исправить Windows fixtures
    if: github.event_name == 'pull_request' && github.head_ref == 'fix/0.3.3-bugfix'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Получить рабочую ветку
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Установить Rustfmt
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Исправить fixtures и очистить временные workflow
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path('apps/desktop/src-tauri/src/analysis/file.rs')
          text = source.read_text(encoding='utf-8')

          old_sha = '''        let mut file = NamedTempFile::new().unwrap();
          file.write_all(b"FileScope test").unwrap();
          let report = analyze_file(
              file.path().to_string_lossy().to_string(),'''
          new_sha = '''        let mut file = NamedTempFile::new().unwrap();
          file.write_all(b"FileScope test").unwrap();
          let path = file.into_temp_path();
          let report = analyze_file(
              path.to_string_lossy().to_string(),'''
          if old_sha not in text:
              raise SystemExit('SHA fixture fragment not found')
          text = text.replace(old_sha, new_sha, 1)

          old_limit = '''        let mut file = NamedTempFile::new().unwrap();
          file.write_all(&vec![1_u8; 2048]).unwrap();
          let mut limits = AnalysisLimits::default();
          limits.maximum_file_size_bytes = 1024;
          let report =
              analyze_file(file.path().to_string_lossy().to_string(), limits, &token()).unwrap();'''
          new_limit = '''        let mut file = NamedTempFile::new().unwrap();
          file.write_all(&vec![1_u8; 2048]).unwrap();
          let path = file.into_temp_path();
          let mut limits = AnalysisLimits::default();
          limits.maximum_file_size_bytes = 1024;
          let report =
              analyze_file(path.to_string_lossy().to_string(), limits, &token()).unwrap();'''
          if old_limit not in text:
              raise SystemExit('size-limit fixture fragment not found')
          source.write_text(text.replace(old_limit, new_limit, 1), encoding='utf-8')

          temporary = Path('.github/workflows/v033-test-handle-fix.yml')
          if temporary.exists():
              temporary.unlink()

          workflow = Path('.github/workflows/ci.yml')
          ci = workflow.read_text(encoding='utf-8')
          ci = ci.replace('permissions:\n  contents: write\n', 'permissions:\n  contents: read\n', 1)
          begin = '  # BEGIN TEMP V033 WINDOWS FIXTURE REPAIR\n'
          end = '  # END TEMP V033 WINDOWS FIXTURE REPAIR\n'
          start = ci.index(begin)
          finish = ci.index(end, start) + len(end)
          ci = ci[:start] + ci[finish:]
          ci = ci.replace('  quality:\n    needs: repair-windows-tests\n', '  quality:\n', 1)
          ci = ci.replace(
              '      - name: Получить исходный код\n        uses: actions/checkout@v4\n        with:\n          ref: ${{ github.head_ref }}\n',
              '      - name: Получить исходный код\n        uses: actions/checkout@v4\n',
          )
          workflow.write_text(ci, encoding='utf-8')
          PY

          cd apps/desktop/src-tauri
          cargo fmt --all
          cd ../../..

      - name: Зафиксировать исправление
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/desktop/src-tauri/src/analysis/file.rs .github/workflows/ci.yml
          git add -u .github/workflows/v033-test-handle-fix.yml
          git commit -m 'test(file): закрывать writer перед стабильным чтением Windows'
          git push origin HEAD:${{ github.head_ref }}
  # END TEMP V033 WINDOWS FIXTURE REPAIR

  quality:
    needs: repair-windows-tests
    name: Lint, типы, тесты и frontend
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Получить исходный код
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Установить Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Установить pnpm
        run: npm install --global pnpm@10.14.0

      - name: Установить фиксированные зависимости
        run: pnpm install --frozen-lockfile

      - name: Проверить неизменность pnpm-lock.yaml
        run: git diff --exit-code -- pnpm-lock.yaml

      - name: Проверить синтаксис doctor
        run: node --check scripts/doctor.mjs

      - name: Проверить версии manifests и production UI
        run: pnpm check:version

      - name: Проверить ESLint
        run: pnpm --filter @filescope/desktop lint

      - name: Проверить TypeScript
        run: pnpm --filter @filescope/desktop typecheck

      - name: Запустить unit-тесты
        run: pnpm --filter @filescope/desktop test

      - name: Собрать frontend
        run: pnpm --filter @filescope/desktop build

      - name: Установить Chromium для smoke-тестов
        run: pnpm --filter @filescope/desktop exec playwright install --with-deps chromium

      - name: Запустить Playwright smoke-тесты
        run: pnpm --filter @filescope/desktop test:e2e

      - name: Сохранить отчёт Playwright при ошибке
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: FileScope-Playwright-Report
          path: apps/desktop/playwright-report
          if-no-files-found: ignore
          retention-days: 14

  windows:
    name: Rust, Windows x64 и NSIS
    needs: quality
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Получить исходный код
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Установить Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Установить pnpm
        run: npm install --global pnpm@10.14.0

      - name: Установить Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Установить фиксированные зависимости
        run: pnpm install --frozen-lockfile

      - name: Проверить неизменность pnpm-lock.yaml
        run: git diff --exit-code -- pnpm-lock.yaml

      - name: Проверить версии manifests и production UI
        run: pnpm check:version

      - name: Проверить форматирование Rust
        working-directory: apps/desktop/src-tauri
        run: cargo fmt --all --check

      - name: Запустить тесты Rust
        working-directory: apps/desktop/src-tauri
        run: cargo test --locked

      - name: Проверить компиляцию Rust
        working-directory: apps/desktop/src-tauri
        run: cargo check --locked

      - name: Собрать desktop-приложение
        run: pnpm --filter @filescope/desktop build:desktop

      - name: Проверить неизменность lock-файлов после сборки
        run: git diff --exit-code -- pnpm-lock.yaml apps/desktop/src-tauri/Cargo.lock

      - name: Сохранить установщик и исполняемый файл
        uses: actions/upload-artifact@v4
        with:
          name: FileScope-Windows-x64
          path: |
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/filescope.exe
          if-no-files-found: error
          retention-days: 30
