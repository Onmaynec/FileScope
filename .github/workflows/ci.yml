name: Проверка и сборка FileScope

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [develop]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, типы, тесты и frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Получить исходный код
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Установить Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22

      - name: Установить pnpm
        run: npm install --global pnpm@10.14.0

      - name: Установить фиксированные зависимости
        run: pnpm install --frozen-lockfile

      - name: Проверить неизменность pnpm-lock.yaml
        run: git diff --exit-code -- pnpm-lock.yaml

      - name: Проверить синтаксис doctor
        run: node --check scripts/doctor.mjs

      - name: Проверить версии manifests и production UI
        run: pnpm check:version

      - name: Проверить готовность архитектуры к v0.4.0
        run: pnpm check:v040-readiness

      - name: Проверить ESLint
        run: pnpm --filter @filescope/desktop lint

      - name: Проверить TypeScript
        run: pnpm --filter @filescope/desktop typecheck

      - name: Запустить unit-тесты
        run: pnpm --filter @filescope/desktop test

      - name: Запустить быстрые property-тесты
        run: pnpm --filter @filescope/desktop test:properties

      - name: Собрать frontend
        run: pnpm --filter @filescope/desktop build

      - name: Установить Chromium для smoke-тестов
        run: pnpm --filter @filescope/desktop exec playwright install --with-deps chromium

      - name: Запустить Playwright smoke-тесты
        run: pnpm --filter @filescope/desktop test:e2e

      - name: Сохранить отчёт Playwright при ошибке
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: FileScope-Playwright-Report
          path: apps/desktop/playwright-report
          if-no-files-found: ignore
          retention-days: 14

  windows:
    name: Rust, Windows x64 и NSIS
    needs: quality
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Получить исходный код
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Установить Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22

      - name: Установить pnpm
        run: npm install --global pnpm@10.14.0

      - name: Установить Rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # pinned revision
        with:
          toolchain: stable
          components: rustfmt

      - name: Установить фиксированные зависимости
        run: pnpm install --frozen-lockfile

      - name: Проверить неизменность pnpm-lock.yaml
        run: git diff --exit-code -- pnpm-lock.yaml

      - name: Проверить версии manifests и production UI
        run: pnpm check:version

      - name: Проверить готовность архитектуры к v0.4.0
        run: pnpm check:v040-readiness

      - name: Проверить форматирование Rust
        working-directory: apps/desktop/src-tauri
        run: cargo fmt --all --check

      - name: Запустить тесты Rust и property-инварианты
        working-directory: apps/desktop/src-tauri
        run: cargo test --locked

      - name: Проверить компиляцию Rust
        working-directory: apps/desktop/src-tauri
        run: cargo check --locked

      - name: Собрать desktop-приложение
        run: pnpm --filter @filescope/desktop build:desktop

      - name: Проверить неизменность lock-файлов после сборки
        run: git diff --exit-code -- pnpm-lock.yaml apps/desktop/src-tauri/Cargo.lock

      - name: Сохранить установщик и исполняемый файл
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: FileScope-Windows-x64
          path: |
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/filescope.exe
          if-no-files-found: error
          retention-days: 30
