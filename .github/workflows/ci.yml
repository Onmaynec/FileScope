name: Проверка и сборка FileScope

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [develop]
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, типы, тесты и frontend
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Получить исходный код
        uses: actions/checkout@v4

      - name: Установить Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Установить pnpm
        run: npm install --global pnpm@10.14.0

      - name: Установить зависимости
        run: pnpm install --no-frozen-lockfile

      - name: Проверить ESLint
        run: pnpm --filter @filescope/desktop lint

      - name: Проверить TypeScript
        run: pnpm --filter @filescope/desktop typecheck

      - name: Запустить unit-тесты
        run: pnpm --filter @filescope/desktop test

      - name: Собрать frontend
        run: pnpm --filter @filescope/desktop build

      - name: Установить Chromium для smoke-тестов
        run: pnpm --filter @filescope/desktop exec playwright install --with-deps chromium

      - name: Запустить Playwright smoke-тесты
        run: pnpm --filter @filescope/desktop test:e2e

      - name: Сохранить отчёт Playwright при ошибке
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: FileScope-Playwright-Report
          path: apps/desktop/playwright-report
          if-no-files-found: ignore
          retention-days: 14

  windows:
    name: Rust, Windows x64 и NSIS
    needs: quality
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Получить исходный код
        uses: actions/checkout@v4

      - name: Установить Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Установить pnpm
        run: npm install --global pnpm@10.14.0

      - name: Установить Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Установить зависимости
        run: pnpm install --no-frozen-lockfile

      - name: Проверить форматирование Rust
        working-directory: apps/desktop/src-tauri
        run: cargo fmt --all --check

      - name: Запустить тесты Rust
        working-directory: apps/desktop/src-tauri
        run: cargo test

      - name: Проверить компиляцию Rust
        working-directory: apps/desktop/src-tauri
        run: cargo check

      - name: Собрать desktop-приложение
        run: pnpm --filter @filescope/desktop build:desktop

      - name: Сохранить установщик и исполняемый файл
        uses: actions/upload-artifact@v4
        with:
          name: FileScope-Windows-x64
          path: |
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/filescope.exe
          if-no-files-found: error
          retention-days: 30
