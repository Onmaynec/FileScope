name: Проверка и сборка FileScope

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [develop]
    tags: ['v*']

jobs:
  quality:
    name: Типы, тесты и frontend
    runs-on: ubuntu-latest
    steps:
      - name: Получить исходный код
        uses: actions/checkout@v4
      - name: Установить pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - name: Установить Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Установить зависимости
        run: pnpm install --frozen-lockfile=false
      - name: Проверить типы
        run: pnpm --filter @filescope/desktop typecheck
      - name: Запустить unit-тесты
        run: pnpm --filter @filescope/desktop test
      - name: Собрать frontend
        run: pnpm --filter @filescope/desktop build

  windows:
    name: Windows x64 и NSIS
    needs: quality
    runs-on: windows-latest
    steps:
      - name: Получить исходный код
        uses: actions/checkout@v4
      - name: Установить pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - name: Установить Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Установить Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Установить зависимости
        run: pnpm install --frozen-lockfile=false
      - name: Собрать desktop-приложение
        run: pnpm --filter @filescope/desktop build:desktop
      - name: Сохранить установщик и исполняемый файл
        uses: actions/upload-artifact@v4
        with:
          name: FileScope-Windows-x64
          path: |
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/filescope.exe
          if-no-files-found: error
