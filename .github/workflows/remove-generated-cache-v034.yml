name: Remove generated cache v0.3.4

on:
  push:
    branches:
      - chore/v0.3.4-readiness
    paths:
      - .github/remove-generated-cache-trigger

permissions:
  contents: write

jobs:
  remove-cache:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: chore/v0.3.4-readiness
          fetch-depth: 0
      - name: Remove generated Python cache file
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm scripts/__pycache__/apply-v034-readiness.cpython-312.pyc
          git commit -m 'chore: remove generated Python cache'
          git push origin HEAD:chore/v0.3.4-readiness
