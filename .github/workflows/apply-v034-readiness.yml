name: Применить подготовку FileScope v0.3.4

on:
  push:
    branches:
      - chore/v0.3.4-readiness
    paths:
      - .github/apply-v034-trigger

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Получить рабочую ветку
        uses: actions/checkout@v7
        with:
          ref: chore/v0.3.4-readiness
          fetch-depth: 0

      - name: Установить Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Установить pnpm
        run: npm install --global pnpm@10.14.0

      - name: Установить Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Исправить и проверить одноразовый генератор
        shell: bash
        run: |
          sed -i '1455s/\\n"$/\\n"""/' scripts/apply-v034-readiness.py
          python -m py_compile scripts/apply-v034-readiness.py

      - name: Применить детерминированные изменения
        run: python scripts/apply-v034-readiness.py

      - name: Пересоздать lock-файлы
        run: |
          pnpm install --lockfile-only --ignore-scripts
          cargo generate-lockfile --manifest-path apps/desktop/src-tauri/Cargo.toml
          cargo generate-lockfile --manifest-path apps/desktop/src-tauri/fuzz/Cargo.toml

      - name: Форматировать Rust
        run: cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml --all

      - name: Зафиксировать продуктовые изменения
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git reset -- .github/workflows/apply-v034-readiness.yml .github/apply-v034-trigger scripts/apply-v034-readiness.py .github/workflows/monitor-v034-apply.yml .github/monitor-v034-trigger .github/v034-apply-runs.json
          git diff --cached --check
          git commit -m 'chore: подготовить FileScope v0.3.4 к v0.4.0'
          git push origin HEAD:chore/v0.3.4-readiness
