name: Одноразовое обновление документации v0.3.3

on:
  push:
    branches: [fix/0.3.3-bugfix]
    paths:
      - '.github/workflows/v033-docs.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/0.3.3-bugfix
          fetch-depth: 0
      - name: Обновить README и CHANGELOG
        run: |
          python - <<'PY'
          from pathlib import Path

          readme = Path('README.md')
          text = readme.read_text(encoding='utf-8')
          text = text.replace(
              '> **Актуальный релиз:** `v0.3.2`  ',
              '> **Текущая разрабатываемая версия:** `v0.3.3`  \n> **Последний опубликованный релиз:** `v0.3.2`  ',
              1,
          )
          text = text.replace('## Возможности v0.3.2', '## Возможности v0.3.3', 1)
          text = text.replace('| Объект | v0.3.2 |', '| Объект | v0.3.3 |', 1)
          text = text.replace('| Запуск в sandbox | Не входит в v0.3.2 |', '| Запуск в sandbox | Не входит в v0.3.3 |', 1)
          marker = '## Как интерпретируется PE-риск\n'
          block = '''## BugFix v0.3.3\n\n- активная URL-проверка блокирует private/local/metadata IPv4 и IPv6, закрепляет DNS за проверенным IP и повторно проверяет каждый redirect;\n- credentials не отправляются в сеть и удаляются из evidence, истории и экспорта;\n- SHA-256, сигнатура и PE-разбор формируются из одного открытого file handle;\n- каталоги, symbolic links, junction и reparse points отклоняются;\n- реальная backend-cancellation использует `jobId`, `JobRegistry`, deadline и ресурсные бюджеты;\n- отчёты используют schema v1 с версиями приложения, анализатора и набора правил;\n- legacy-история мигрируется с резервной копией исходных данных;\n- native drag-and-drop добавляет файлы без автозапуска;\n- тематический Select/Listbox поддерживает мышь и клавиатуру;\n- master-detail очередь виртуализирована и рассчитана на 150+ объектов.\n\nПодробности: [release notes v0.3.3](docs/releases/v0.3.3.md), [границы активной сети](docs/security/active-url-boundaries.md), [атомарность и задания](docs/architecture/atomic-analysis-and-jobs.md).\n\n'''
          if block not in text:
              text = text.replace(marker, block + marker, 1)
          readme.write_text(text, encoding='utf-8')

          changelog = Path('CHANGELOG.md')
          text = changelog.read_text(encoding='utf-8')
          marker = '## [Не выпущено]\n'
          block = '''## [0.3.3] — не выпущено\n\n### Исправлено\n\n- закрыты SSRF, DNS rebinding, redirect и credentials-риски активного URL-анализатора;\n- файловый SHA-256 и структурный разбор используют один открытый объект и отклоняют reparse points;\n- изменение файла во время анализа формирует типизированную ошибку вместо сомнительного отчёта;\n- отмена ожидает подтверждения Rust backend и работает во время hashing, ZIP traversal, DNS и HTTP;\n- browser fallback больше не выдаёт отдельный production verdict;\n- версия приложения больше не дублируется строковыми литералами в UI и экспорте;\n- история отчётов мигрируется на schema v1 с резервной копией legacy-данных;\n- drag-and-drop, текст «Загрузить файлы», custom Select и master-detail очередь исправляют UX массовой проверки.\n\n### Добавлено\n\n- `JobRegistry`, типизированные ошибки и resource budgets;\n- `schemaVersion`, `appVersion`, `analyzerVersion`, `ruleSetVersion`, `createdBy`, `analysisCompleteness`;\n- SHA-256 payload в JSON/HTML export с явной пометкой об отсутствии цифровой подписи;\n- поиск, фильтры, virtualization и навигация по завершённым отчётам;\n- security и architecture документация v0.3.3.\n\n### Безопасность\n\n- локальные/private/metadata сети блокируются до соединения;\n- каждый redirect повторно проходит DNS/IP-проверку;\n- credentials redaction применяется до сохранения и экспорта;\n- анализируемые файлы не запускаются, ZIP не извлекается на диск.\n\n'''
          if '## [0.3.3] — не выпущено' not in text:
              text = text.replace(marker, marker + '\n' + block, 1)
          changelog.write_text(text, encoding='utf-8')
          PY
      - name: Удалить workflow и зафиксировать документацию
        run: |
          rm .github/workflows/v033-docs.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md CHANGELOG.md
          git add -u .github/workflows/v033-docs.yml
          git commit -m 'docs(release): описать FileScope v0.3.3 BugFix'
          git push origin HEAD:fix/0.3.3-bugfix
