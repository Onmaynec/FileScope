name: Одноразовое обновление release checks v0.3.3

on:
  push:
    branches: [fix/0.3.3-bugfix]
    paths:
      - '.github/workflows/v033-release-check.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/0.3.3-bugfix
          fetch-depth: 0
      - name: Добавить version и contract consistency в release
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/release.yml')
          text = path.read_text(encoding='utf-8')
          old = '''      - name: Проверить синтаксис doctor\n        run: node --check scripts/doctor.mjs\n\n      - name: Проверить ESLint'''
          new = '''      - name: Проверить синтаксис doctor\n        run: node --check scripts/doctor.mjs\n\n      - name: Проверить версии и schema contracts\n        run: pnpm check:version\n\n      - name: Проверить ESLint'''
          if old not in text:
              raise SystemExit('validate insertion point missing')
          text = text.replace(old, new, 1)

          old = '''      - name: Проверить неизменность pnpm-lock.yaml\n        run: git diff --exit-code -- pnpm-lock.yaml\n\n      - name: Проверить форматирование Rust'''
          new = '''      - name: Проверить неизменность pnpm-lock.yaml\n        run: git diff --exit-code -- pnpm-lock.yaml\n\n      - name: Проверить версии и schema contracts\n        run: pnpm check:version\n\n      - name: Проверить форматирование Rust'''
          if old not in text:
              raise SystemExit('windows insertion point missing')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Удалить workflow и зафиксировать release checks
        run: |
          rm .github/workflows/v033-release-check.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/release.yml
          git add -u .github/workflows/v033-release-check.yml
          git commit -m 'test(release): проверять версии и schema contracts'
          git push origin HEAD:fix/0.3.3-bugfix
